<!DOCTYPE html><html>
<head>
    <title>belajar firebase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Firebase Belajar</h1>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

      const firebaseConfig = {
          ...
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      function getData() {
        const siswaRef = ref(db, "Siswa");

        get(siswaRef)
          .then((snapshot) => {
            if (snapshot.exists()) {
              console.log("Data Diterima");
              console.log(snapshot.val());
            } else {
              console.log("Data Tidak Ditemukan");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
          });
      }

      getData();

    </script>
    <script src="script.js"></script>
</body>
</html>
