<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Set - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffe2ec; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 text-center">
                        <h3 class="mb-4 card-title text-primary">Firebase</h3>
                        <div class="mb-3 text-start">
                            <label for="slider" class="form-label fw-bold">Atur Nilai Slider:</label>
                            <input type="range" class="form-range" id="slider" min="0" max="100" value="0">
                        </div>
                        <div class="alert alert-info fs-4" role="alert">
                            Nilai saat ini: <span id="value" class="fw-bold text-danger">0</span>
                        </div>
                        <p class="card-text text-muted">Contoh penggunaan bootstrap dalam Firebase</p>
                        <button class="btn btn-primary w-100" id="btnSave">Simpan ke Firebase</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    
    const slider = document.getElementById('slider');
    const valueLihat = document.getElementById('value');
    slider.addEventListener('input', (e) => {
        const nilai = e.target.value;
        valueLihat.innerHTML = nilai;
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        alert('Data: ' + slider.value + ' aman');
    });

</script>

</body>
</html>
