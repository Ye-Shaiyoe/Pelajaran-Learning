<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light gap-3 d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow" style="width: 20%;">
        <div class="card-body text-center">
            <h4 class="card-title">Tekan Button 1 </h4>
            <p class="card-text">klik tombol di bawah ini</p>
            <button class="btn btn-success" id="tombol">klik!</button>
            <p class="mt-3 fw-bold text-muted" id="teks">Status : True</p>
        </div>
    </div>
    <div class="card shadow" style="width: 20%;">
        <div class="card-body text-center">
            <h4 class="card-title">Tekan Button 2 </h4>
            <p class="card-text">klik tombol di bawah ini</p>
            <button class="btn btn-success" id="tombolDua">klik!</button>
            <p class="mt-3 fw-bold text-muted" id="teksDua">Status : True</p>
        </div>
    </div>
    <script>
        let status = true;
        let statusDua = true;
        const tombol = document.getElementById('tombol');
        const teks = document.getElementById('teks');
        tombol.addEventListener( 'click', function(){
            status = !status;
            if(status){
                teks.textContent = "Status: True";
                tombol.classList.remove('btn-danger');
                tombol.classList.add('btn-success');
                teks.classList.remove('text-muted');
                teks.classList.add('text-success');
            }
            else if(!status) {
                teks.textContent = "Status : False";
                tombol.classList.remove('btn-success');
                tombol.classList.add('btn-danger');
                teks.classList.remove('text-success');
                teks.classList.add('text-muted');
            }
        });

        // logika button dua
        tombolDua.addEventListener('click', function(){
            statusDua = !statusDua;
            if(statusDua){
                teksDua.textContent = "Status: True";
                tombolDua.classList.remove('btn-danger');
                tombolDua.classList.add('btn-success');
                teksDua.classList.remove('text-muted');
                teksDua.classList.add('text-success');
            }
            else if(!statusDua) {
                teksDua.textContent = "Status : False";
                tombolDua.classList.remove('btn-success');
                tombolDua.classList.add('btn-danger');
                teksDua.classList.remove('text-success');
                teksDua.classList.add('text-muted');
            }
        });
    </script>
</body>
</html>
